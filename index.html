<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self' blob:;style-src 'self' blob:;img-src 'self' blob: data:;connect-src 'self';frame-src 'self' blob:;base-uri 'self';form-action 'none';object-src 'none'">
  <title>Cloudscape_Journal · 访问密码</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/access.css?v=e94239e8f7b7">
  <script defer src="./assets/access.js?v=e94239e8f7b7"></script>
</head>
<body data-root="./">
  <main class="gate" id="gate">
    <a class="gate-brand" href="./index.html">Cloudscape<span>_Journal</span></a>
    <section class="gate-card" aria-labelledby="gate-title">


      <h1 id="gate-title">私人手记</h1>

      <form id="unlock-form">
        <label for="access-password">访问密码</label>
        <div class="password-field"><input id="access-password" name="password" type="password" autocomplete="current-password" required spellcheck="false" aria-describedby="access-status"><button type="button" id="show-password" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
        <button class="unlock-button" id="unlock-button" type="submit" disabled><span>进入手记</span><span aria-hidden="true">→</span></button>
        <p class="access-status" id="access-status" role="status" aria-live="polite"></p>
      </form>

    </section>
    <footer class="gate-footer"><span>© 2026 Cloudscape_Journal</span><svg viewBox="0 0 24 24" aria-label="密码保护"><rect x="5" y="10" width="14" height="11" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></footer>
  </main>
  <iframe id="journal-frame" title="Cloudscape_Journal 内容" allow="clipboard-write" hidden></iframe>
  <button class="lock-button" id="lock-button" type="button" hidden aria-label="锁定手记"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v2"/></svg><span>锁定</span></button>
</body>
</html>
